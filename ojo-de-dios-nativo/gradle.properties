# Memoria para el proceso de Gradle. 2 GB es suficiente para un proyecto de
# este tamaño; con menos, la sincronización inicial puede quedarse corta.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Compilar módulos y tareas en paralelo cuando se pueda.
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX es obligatorio: las dependencias modernas de Compose viven ahí.
android.useAndroidX=true

# Cada módulo genera su propio R, sin heredar recursos de las dependencias.
# Hace las compilaciones más rápidas y evita colisiones de nombres.
android.nonTransitiveRClass=true

kotlin.code.style=official
